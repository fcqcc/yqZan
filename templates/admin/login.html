<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f5f5f5}
.card{background:#fff;border-radius:12px;padding:32px;width:360px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:1.2rem;margin-bottom:20px;color:#333;text-align:center}
input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:.9rem;outline:0;transition:border .2s}
input:focus{border-color:#9d2d5a}
button{width:100%;padding:10px;background:#9d2d5a;color:#fff;border:none;border-radius:6px;font-size:.9rem;cursor:pointer;margin-top:12px}
button:hover{background:#ab3467}
.error{color:#d4380d;font-size:.8rem;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h1>🔐 管理后台</h1>
<form method="post">
<input type="password" name="password" placeholder="输入管理员密码" autofocus>
<button type="submit">登录</button>
</form>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
</div>
</body>
</html>
